# --- 1-Wire core ---
CONFIG_W1=y
CONFIG_W1_NRF_GPIO=y
# --- UART / UARTE ---
CONFIG_SERIAL=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y   # REQUIRED for 1-Wire baud switching
CONFIG_W1_NRF_SERIAL=y

# --- Sensor subsystem + DS18B20 driver ---
CONFIG_SENSOR=y
CONFIG_DS18B20=n


# --- Float printing (temperature has fractional part) ---
CONFIG_CBPRINTF_FP_SUPPORT=y

# --- Logging ---
CONFIG_LOG=y
CONFIG_PRINTK=y

# Amount of connected devices to the one wire line
CONFIG_COUNT_CONNECTED_DEVICES=1

# ZTest
CONFIG_ZTEST=y

# CPU LOAD
CONFIG_CPU_LOAD=y
CONFIG_W1_NRF_GPIO_TIME_CRITICAL=y
CONFIG_W1_ZEPHYR_GPIO_TIME_CRITICAL=y

CONFIG_MPU_STACK_GUARD=y
CONFIG_STACK_SENTINEL=y