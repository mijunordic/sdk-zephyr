# --- 1-Wire core ---
CONFIG_W1=y
CONFIG_W1_ZEPHYR_SERIAL=y

# --- UART / UARTE ---
CONFIG_SERIAL=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y   # REQUIRED for 1-Wire baud switching

# --- Sensor subsystem + DS18B20 driver ---
CONFIG_SENSOR=y
CONFIG_DS18B20=y

# --- Float printing (temperature has fractional part) ---
CONFIG_CBPRINTF_FP_SUPPORT=y

# --- Logging ---
CONFIG_LOG=y
CONFIG_PRINTK=y

# Amount of connected devices to the one wire line
CONFIG_COUNT_CONNECTED_DEVICES=1

# ZTest
CONFIG_ZTEST=n

CONFIG_SENSOR_LOG_LEVEL_DBG=y

CONFIG_GPIO=y
CONFIG_W1_ZEPHYR_GPIO=y